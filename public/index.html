<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roti Nusa — Admin Dashboard</title>

  <style>
    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f6f7f9;
      color: #1f2937;
    }

    button {
      font-family: inherit;
    }


    /* =========================================
       LAYOUT
    ========================================= */

    .app {
      min-height: 100vh;
    }

    .main {
      max-width: 1250px;
      margin: 0 auto;
      padding: 30px;
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 30px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1250px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111827;
      color: white;

      border-radius: 10px;

      font-weight: 700;
      font-size: 18px;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 18px;
    }

    .brand-text span {
      display: block;
      margin-top: 2px;

      font-size: 12px;
      color: #6b7280;
    }

    .refresh-button {
      border: 1px solid #e5e7eb;
      background: white;

      padding: 9px 14px;
      border-radius: 8px;

      cursor: pointer;
      font-size: 14px;

      transition: 0.2s;
    }

    .refresh-button:hover {
      background: #f3f4f6;
    }


    /* =========================================
       PAGE TITLE
    ========================================= */

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      margin-bottom: 25px;
    }

    .page-header h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .page-header p {
      margin: 7px 0 0;
      color: #6b7280;
      font-size: 14px;
    }


    /* =========================================
       STATISTICS
    ========================================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;

      margin-bottom: 28px;
    }

    .stat-card {
      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 20px;

      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
    }

    .stat-label {
      font-size: 13px;
      color: #6b7280;

      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 700;

      color: #111827;
    }


    /* =========================================
       FILTER
    ========================================= */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
      margin-bottom: 18px;
    }

    .filter {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .filter button {
      border: 1px solid #e5e7eb;
      background: white;

      padding: 9px 15px;
      border-radius: 8px;

      color: #6b7280;

      cursor: pointer;

      transition: 0.2s;
    }

    .filter button:hover {
      background: #f3f4f6;
    }

    .filter button.active {
      background: #111827;
      color: white;
      border-color: #111827;
    }


    /* =========================================
       ORDER LIST
    ========================================= */

    #orders {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .order {
      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 22px;

      transition: box-shadow 0.2s;
    }

    .order:hover {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
    }

    .order-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding-bottom: 17px;
      margin-bottom: 17px;

      border-bottom: 1px solid #f0f0f0;
    }

    .order-id {
      margin: 0;

      font-size: 16px;
      font-weight: 700;
    }

    .order-name {
      margin: 4px 0 0;

      font-size: 13px;
      color: #6b7280;
    }


    /* =========================================
       STATUS BADGE
    ========================================= */

    .status {
      display: inline-flex;
      align-items: center;

      padding: 6px 10px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 600;
    }

    .status-pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .status-confirmed {
      background: #ecfdf5;
      color: #047857;
    }

    .status-rejected {
      background: #fef2f2;
      color: #b91c1c;
    }


    /* =========================================
       ORDER DETAILS
    ========================================= */

    .order-details {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 14px 30px;
    }

    .detail {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 12px;
      color: #9ca3af;
    }

    .detail-value {
      font-size: 14px;
      color: #374151;
      line-height: 1.5;
    }

    .detail-value.price {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }


    /* =========================================
       CANCELLATION
    ========================================= */

    .cancellation {
      margin-top: 18px;

      padding: 13px 15px;

      border: 1px solid #fed7aa;
      background: #fff7ed;

      border-radius: 9px;

      color: #9a3412;

      font-size: 13px;
      font-weight: 600;
    }


    /* =========================================
       BUTTONS
    ========================================= */

    .buttons {
      display: flex;
      gap: 9px;

      margin-top: 20px;
      padding-top: 18px;

      border-top: 1px solid #f0f0f0;
    }

    .action-button {
      border: none;

      padding: 10px 16px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 600;

      transition: 0.2s;
    }

    .confirm {
      background: #111827;
      color: white;
    }

    .confirm:hover {
      background: #000000;
    }

    .reject {
      background: #f3f4f6;
      color: #374151;
    }

    .reject:hover {
      background: #e5e7eb;
    }


    /* =========================================
       EMPTY / LOADING
    ========================================= */

    .empty {
      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 50px 25px;

      text-align: center;
    }

    .empty-title {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .empty-text {
      font-size: 14px;
      color: #6b7280;
    }


    /* =========================================
       FOOTER
    ========================================= */

    .footer {
      text-align: center;

      padding: 30px 20px;

      color: #9ca3af;
      font-size: 12px;
    }


    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 900px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .order-details {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 600px) {

      .header {
        padding: 15px 18px;
      }

      .main {
        padding: 22px 15px;
      }

      .brand-text h1 {
        font-size: 16px;
      }

      .page-header h2 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 25px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .order {
        padding: 17px;
      }

      .order-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .buttons {
        flex-direction: column;
      }

      .action-button {
        width: 100%;
      }

    }


    @media (max-width: 400px) {

      .stats {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

  <div class="app">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

      <div class="header-inner">

        <div class="brand">

          <div class="brand-logo">
            RN
          </div>

          <div class="brand-text">
            <h1>Roti Nusa</h1>
            <span>Admin Dashboard</span>
          </div>

        </div>


        <button
          class="refresh-button"
          onclick="loadOrders()">

          ↻ Refresh

        </button>

      </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">


      <!-- PAGE HEADER -->

      <div class="page-header">

        <div>

          <h2>Pesanan Masuk</h2>

          <p>
            Kelola pesanan pelanggan Roti Nusa.
          </p>

        </div>

      </div>



      <!-- =========================================
           STATISTICS
      ========================================== -->

      <section class="stats">


        <div class="stat-card">

          <div class="stat-label">
            Total Pesanan
          </div>

          <div
            class="stat-number"
            id="totalOrders">
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            Pending
          </div>

          <div
            class="stat-number"
            id="pendingOrders">
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            Confirmed
          </div>

          <div
            class="stat-number"
            id="confirmedOrders">
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-label">
            Rejected
          </div>

          <div
            class="stat-number"
            id="rejectedOrders">
            0
          </div>

        </div>


      </section>



      <!-- =========================================
           FILTER
      ========================================== -->

      <div class="toolbar">

        <div class="filter">

          <button
            id="filterAll"
            class="active"
            onclick="setFilter('All')">

            Semua

          </button>


          <button
            id="filterPending"
            onclick="setFilter('Pending')">

            Pending

          </button>


          <button
            id="filterConfirmed"
            onclick="setFilter('Confirmed')">

            Confirmed

          </button>


          <button
            id="filterRejected"
            onclick="setFilter('Rejected')">

            Rejected

          </button>

        </div>

      </div>



      <!-- =========================================
           ORDERS
      ========================================== -->

      <div id="orders">

        <div class="empty">

          <div class="empty-title">
            Memuat pesanan...
          </div>

          <div class="empty-text">
            Mengambil data dari Botpress.
          </div>

        </div>

      </div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

      Roti Nusa Admin Dashboard

    </footer>


  </div>



  <script>

    let allOrders = [];

    let currentFilter = "All";


    // =========================================
    // LOAD ORDERS
    // =========================================

    async function loadOrders() {

      const container =
        document.getElementById("orders");


      container.innerHTML = `
        <div class="empty">

          <div class="empty-title">
            Memuat pesanan...
          </div>

          <div class="empty-text">
            Mengambil data terbaru.
          </div>

        </div>
      `;


      try {

        const response =
          await fetch("/api/orders");


        if (!response.ok) {

          throw new Error(
            "Gagal mengambil pesanan"
          );

        }


        allOrders =
          await response.json();


        displayOrders();


      } catch (error) {

        console.error(error);


        container.innerHTML = `
          <div class="empty">

            <div class="empty-title">
              Gagal mengambil data
            </div>

            <div class="empty-text">
              Pastikan server sedang berjalan.
            </div>

          </div>
        `;

      }

    }



    // =========================================
    // DISPLAY ORDERS
    // =========================================

    function displayOrders() {

      const container =
        document.getElementById("orders");


      // =========================================
      // STATISTICS
      // =========================================

      document.getElementById("totalOrders").textContent =
        allOrders.length;


      document.getElementById("pendingOrders").textContent =
        allOrders.filter(
          order => order.status === "Pending"
        ).length;


      document.getElementById("confirmedOrders").textContent =
        allOrders.filter(
          order => order.status === "Confirmed"
        ).length;


      document.getElementById("rejectedOrders").textContent =
        allOrders.filter(
          order => order.status === "Rejected"
        ).length;



      // =========================================
      // FILTER
      // =========================================

      let orders = allOrders;


      if (currentFilter !== "All") {

        orders =
          allOrders.filter(
            order =>
              order.status === currentFilter
          );

      }



      // =========================================
      // EMPTY
      // =========================================

      if (orders.length === 0) {

        container.innerHTML = `
          <div class="empty">

            <div class="empty-title">
              Tidak ada pesanan
            </div>

            <div class="empty-text">
              Belum ada pesanan dengan status ini.
            </div>

          </div>
        `;

        return;

      }



      // =========================================
      // ORDER CARDS
      // =========================================

      container.innerHTML = orders.map(order => {


        // =======================================
        // STATUS CLASS
        // =======================================

        let statusClass =
          "status-pending";


        if (order.status === "Confirmed") {

          statusClass =
            "status-confirmed";

        }


        if (order.status === "Rejected") {

          statusClass =
            "status-rejected";

        }



        // =======================================
        // BUTTONS
        // =======================================

        let buttons = "";


        if (order.status === "Pending") {

          buttons = `

            <div class="buttons">

              <button
                class="action-button confirm"
                onclick="updateStatus(
                  ${order.id},
                  'Confirmed'
                )">

                ✓ Terima Pesanan

              </button>


              <button
                class="action-button reject"
                onclick="updateStatus(
                  ${order.id},
                  'Rejected'
                )">

                Tolak Pesanan

              </button>

            </div>

          `;

        }



        // =======================================
        // CANCELLATION
        // =======================================

        let cancellationNotice = "";


        if (
          order.cancellation_requested === true
        ) {

          cancellationNotice = `

            <div class="cancellation">

              ⚠ Customer meminta pembatalan pesanan ini.
              <br>

              <span style="
                font-weight: 400;
                display: inline-block;
                margin-top: 4px;
              ">

                Permintaan menunggu pemeriksaan admin.

              </span>

            </div>

          `;

        }



        // =======================================
        // RETURN CARD
        // =======================================

        return `

          <article class="order">


            <div class="order-top">


              <div>

                <h3 class="order-id">

                  Pesanan #${order.id}

                </h3>


                <p class="order-name">

                  ${order.Customer_name}

                </p>

              </div>


              <span
                class="status ${statusClass}">

                ${order.status}

              </span>


            </div>



            <div class="order-details">


              <div class="detail">

                <span class="detail-label">
                  Pesanan
                </span>

                <span class="detail-value">
                  ${order.order_details}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Jumlah
                </span>

                <span class="detail-value">
                  ${order.quantity}
                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Waktu Pengambilan
                </span>

                <span class="detail-value">

                  ${order.pickup_date}
                  pukul
                  ${order.pickup_time}

                </span>

              </div>


              <div class="detail">

                <span class="detail-label">
                  Total
                </span>

                <span class="detail-value price">

                  Rp${Number(
                    order.total_price
                  ).toLocaleString("id-ID")}

                </span>

              </div>


            </div>



            ${cancellationNotice}


            ${buttons}


          </article>

        `;

      }).join("");

    }



    // =========================================
    // FILTER
    // =========================================

    function setFilter(filter) {

      currentFilter =
        filter;


      document
        .querySelectorAll(".filter button")
        .forEach(button => {

          button.classList.remove(
            "active"
          );

        });


      const buttonMap = {

        All: "filterAll",

        Pending: "filterPending",

        Confirmed: "filterConfirmed",

        Rejected: "filterRejected"

      };


      const activeButton =
        document.getElementById(
          buttonMap[filter]
        );


      if (activeButton) {

        activeButton.classList.add(
          "active"
        );

      }


      displayOrders();

    }



    // =========================================
    // UPDATE STATUS
    // =========================================

    async function updateStatus(
      orderId,
      status
    ) {


      const action =
        status === "Confirmed"
          ? "menerima"
          : "menolak";


      const yakin =
        confirm(
          `Yakin ingin ${action} pesanan #${orderId}?`
        );


      if (!yakin) {

        return;

      }



      try {

        const response =
          await fetch(
            `/api/orders/${orderId}/status`,
            {

              method: "PUT",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body: JSON.stringify({

                status: status

              })

            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "Gagal mengubah status"
          );

        }


        await loadOrders();


      } catch (error) {

        console.error(error);


        alert(
          "Gagal mengubah status pesanan."
        );

      }

    }



    // =========================================
    // INITIAL LOAD
    // =========================================

    loadOrders();

  </script>

</body>
</html>
